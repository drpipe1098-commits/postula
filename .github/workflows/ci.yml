name: POSTULA CI
run-name: POSTULA CI · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postula-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contratos:
    name: contratos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Contexto de la corrida
        run: |
          {
            echo "## POSTULA CI"
            echo ""
            echo "- Evento: \`${{ github.event_name }}\`"
            echo "- Rama: \`${{ github.ref_name }}\`"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- Node: \`$(node --version)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sintaxis de todos los archivos JavaScript
        run: |
          set -e
          for archivo in $(find extension -name '*.js'); do
            node --check "$archivo"
            echo "ok $archivo"
          done
          for archivo in $(find herramientas tests -name '*.mjs'); do
            node --check "$archivo"
            echo "ok $archivo"
          done

      - name: Las herramientas de terminal arrancan sin argumentos
        run: |
          set -e
          node herramientas/hv-a-perfil.mjs --ayuda > /dev/null
          node herramientas/vacantes.mjs --ayuda > /dev/null
          echo "ok ayuda de las dos herramientas"

      - name: El manifiesto es JSON válido
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

      - name: Candados de contrato
        run: npm test

      - name: La extensión no trae dependencias
        run: |
          test ! -d node_modules || (echo "No debe haber node_modules en el repositorio" && exit 1)
          node -e "const p=require('./package.json'); if(p.dependencies||p.devDependencies){console.error('POSTULA no puede tener dependencias');process.exit(1)}"

      - name: Resultado
        if: always()
        # Va como bloque `|` a propósito: en una sola línea, el «: » de
        # «Resultado: » convierte el escalar en un mapa y YAML deja de
        # parsear el archivo entero. Eso es lo que tenía a POSTULA CI sin
        # arrancar —fallo de arranque, cero jobs— desde que se escribió.
        run: |
          echo "- Resultado: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"

  navegador:
    name: navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Navegador disponible en el runner
        run: |
          for binario in /usr/bin/google-chrome-stable /usr/bin/google-chrome /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$binario" ]; then
              echo "POSTULA_CHROME=$binario" >> "$GITHUB_ENV"
              echo "Navegador: $binario"
              exit 0
            fi
          done
          echo "No hay navegador en el runner; se instala chromium."
          sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
          echo "POSTULA_CHROME=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"

      - name: Autorrelleno sobre formularios reales
        env:
          POSTULA_EXIGIR_NAVEGADOR: '1'
        run: node tests/navegador-contract.mjs

  validate:
    name: validate
    needs: [contratos, navegador]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Agregado de compuertas obligatorias
        run: |
          if [ "${{ needs.contratos.result }}" != "success" ]; then
            echo "La compuerta «contratos» no pasó."
            exit 1
          fi
          if [ "${{ needs.navegador.result }}" != "success" ]; then
            echo "La compuerta «navegador» no pasó."
            exit 1
          fi
          echo "Todas las compuertas de POSTULA CI pasaron."
